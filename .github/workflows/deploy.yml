name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Typst cache
        uses: actions/cache@v4
        with:
          path: typst-bin
          # Populated by cache-typst.yml; keep in sync with TYPST_VERSION there.
          key: typst-0.15.0

      - name: Restore fonts cache
        uses: actions/cache@v4
        with:
          path: fonts-bin
          key: fonts

      - name: Add Typst to PATH
        run: |
          chmod +x typst-bin/typst
          echo "$PWD/typst-bin" >> $GITHUB_PATH
          echo "TYPST_FONT_PATH=$PWD/fonts-bin" >> $GITHUB_ENV

      - name: Build site
        env:
          BASE_PATH: /portfolio
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy build --project-name="${{ secrets.CF_PAGES_PROJECT_NAME }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
