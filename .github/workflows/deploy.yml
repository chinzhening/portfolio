name: Deploy blog to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.17.0
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Set up Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.0

      - name: Build site
        env:
          BASE_PATH: /portfolio
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        run: pnpm wrangler pages deploy build --project-name="${{ secrets.CF_PAGES_PROJECT_NAME }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
