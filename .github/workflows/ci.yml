name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting only, for now. `eslint .` and `svelte-check` both report
  # pre-existing errors; add them as steps here once they are clean.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10, which rejects a lockfile written by npm 11:
      # @tailwindcss/oxide-wasm32-wasi lists its @emnapi deps as
      # bundleDependencies, so npm 11 correctly keeps them out of the lock
      # while npm 10 reports them missing. Pin to the major used locally.
      - name: Pin npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .
